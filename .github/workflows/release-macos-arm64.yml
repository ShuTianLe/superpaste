name: Release macOS arm64 DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 1.0.11
      build:
        description: CFBundleVersion
        required: true
        default: "12"
      publish_release:
        description: Create GitHub Release
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      replace_existing_release:
        description: Replace an existing tag and release after validation
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [[ -d /Applications/Xcode_26.0.app ]]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          elif [[ -d /Applications/Xcode.app ]]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcrun --find actool

      - name: Install Icon Composer
        run: |
          set -euo pipefail
          brew update
          brew install --cask icon-composer
          test -x "/Applications/Icon Composer.app/Contents/Executables/ictool"

      - name: Verify icon source
        run: |
          set -euo pipefail
          /Applications/Icon\ Composer.app/Contents/Executables/ictool Resources/AppIcon.icon \
            --export-image \
            --output-file /tmp/AppIcon-Light.png \
            --platform macOS \
            --rendition Default \
            --width 1024 \
            --height 1024 \
            --scale 1
          /Applications/Icon\ Composer.app/Contents/Executables/ictool Resources/AppIcon.icon \
            --export-image \
            --output-file /tmp/AppIcon-Dark.png \
            --platform macOS \
            --rendition Dark \
            --width 1024 \
            --height 1024 \
            --scale 1
          test -s /tmp/AppIcon-Light.png
          test -s /tmp/AppIcon-Dark.png

      - name: Build and test
        run: |
          set -euo pipefail
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" = "${{ inputs.version }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Resources/Info.plist)" = "${{ inputs.build }}"
          swift build
          swift test
          swift build -c release --arch arm64
          swift run ClipShelfCoreSmokeTests
          Scripts/security_check.sh
          Scripts/make_dmg.sh
          codesign --verify --deep --strict --verbose=2 dist/Superpaste.app
          test -f dist/Superpaste.app/Contents/Resources/Assets.car
          assetutil --info dist/Superpaste.app/Contents/Resources/Assets.car > /tmp/assets.json
          grep -E '"Name" : "AppIcon"|"AssetType" : "IconImageStack"|"Appearance" : "NSAppearanceNameDarkAqua"|"Appearance" : "NSAppearanceNameAqua"' /tmp/assets.json

      - name: Prepare release asset
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          ASSET="Superpaste-v${VERSION}-macOS-arm64.dmg"
          cp dist/Superpaste.dmg "dist/${ASSET}"
          SHA_VALUE="$(shasum -a 256 "dist/${ASSET}" | awk '{print $1}')"
          echo "${SHA_VALUE}  ${ASSET}" | tee "dist/${ASSET}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superpaste-v${{ inputs.version }}-macOS-arm64
          path: |
            dist/Superpaste-v${{ inputs.version }}-macOS-arm64.dmg
            dist/Superpaste-v${{ inputs.version }}-macOS-arm64.dmg.sha256

      - name: Create GitHub Release
        if: ${{ inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          TAG="v${VERSION}"
          ASSET="Superpaste-v${VERSION}-macOS-arm64.dmg"
          SHA_LINE="$(cat "dist/${ASSET}.sha256")"
          cat > /tmp/release-notes.md <<EOF
          macOS 14+，Apple Silicon / arm64。

          更新内容：
          - 修复首次打开或悬停时，已加载的图片预览仍停留在占位状态的问题。
          - 图片异步加载完成后自动刷新，失败的预览可在重新打开面板后重试。
          - 修复设置页粘贴模式控件越界，并改善中英文长文本布局。
          - 保持悬停反馈与正式选择独立，图片加载不影响键盘浏览。

          macOS 14+, Apple Silicon / arm64.

          Changes:
          - Fixed image previews getting stuck on placeholders on first open or hover.
          - Refresh previews automatically after loading and retry failed previews when reopening the panel.
          - Fixed overflowing paste-mode controls and improved Chinese and English settings layouts.
          - Kept hover feedback independent of selection and image loading independent of keyboard navigation.

          SHA-256:

          \`\`\`text
          ${SHA_LINE}
          \`\`\`
          EOF
          sed -i '' 's/^          //' /tmp/release-notes.md
          if [[ "${{ inputs.replace_existing_release }}" == "true" ]]; then
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                "dist/${ASSET}" "dist/${ASSET}.sha256" \
                --repo "${{ github.repository }}" \
                --clobber
              gh release edit "$TAG" \
                --repo "${{ github.repository }}" \
                --title "Superpaste ${VERSION} - macOS arm64" \
                --notes-file /tmp/release-notes.md \
                --target "${{ github.sha }}"
            else
              gh release create "$TAG" \
                "dist/${ASSET}" "dist/${ASSET}.sha256" \
                --repo "${{ github.repository }}" \
                --target "${{ github.sha }}" \
                --title "Superpaste ${VERSION} - macOS arm64" \
                --notes-file /tmp/release-notes.md
            fi
            git tag -f "$TAG" "${{ github.sha }}"
            git push origin "refs/tags/$TAG" --force
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; ordinary releases cannot replace it." >&2
              exit 1
            fi
            gh release create "$TAG" \
              "dist/${ASSET}" "dist/${ASSET}.sha256" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Superpaste ${VERSION} - macOS arm64" \
              --notes-file /tmp/release-notes.md
          fi
